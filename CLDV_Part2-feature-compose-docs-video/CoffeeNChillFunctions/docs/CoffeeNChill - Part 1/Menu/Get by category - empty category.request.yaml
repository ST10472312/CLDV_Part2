$kind: http-request
url: "{{baseUrl}}/api/menu/category/Sandwiches"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK, not 404", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Returns an empty array", function () {
          const items = pm.response.json();
          pm.expect(items).to.be.an("array");
          pm.expect(items).to.have.lengthOf(0);
      });
    language: text/javascript
order: 7000
