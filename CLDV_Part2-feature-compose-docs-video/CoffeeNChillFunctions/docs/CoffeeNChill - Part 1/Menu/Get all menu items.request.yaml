$kind: http-request
url: "{{baseUrl}}/api/menu"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Returns an array", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });

      pm.test("Contains the item created by this run", function () {
          const created = pm.collectionVariables.get("createdRowKey");
          const match = pm.response.json().filter(function (item) {
              return item.RowKey === created;
          });
          pm.expect(match).to.have.lengthOf(1);
      });

      pm.test("Every item carries the menu fields", function () {
          pm.response.json().forEach(function (item) {
              pm.expect(item).to.have.property("PartitionKey");
              pm.expect(item).to.have.property("RowKey");
              pm.expect(item).to.have.property("Name");
              pm.expect(item.Price).to.be.a("number");
              pm.expect(item.IsAvailable).to.be.a("boolean");
          });
      });
    language: text/javascript
order: 5000
