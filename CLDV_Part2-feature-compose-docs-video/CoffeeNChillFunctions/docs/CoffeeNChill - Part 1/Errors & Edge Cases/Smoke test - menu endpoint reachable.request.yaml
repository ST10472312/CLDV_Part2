$kind: http-request
url: "{{baseUrl}}/api/menu"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Code attribution
      // The pm.test wrapper and the pm.response.to.have.status assertion used
      // throughout this collection follow the examples published in:
      // Postman, 2026a. Test examples in Postman. [Online]
      // Available at: https://learning.postman.com/docs/tests-and-scripts/
      //   write-scripts/test-examples/
      // [Accessed 14 September 2026].

      pm.test("The Functions host answered", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Storage is reachable and returned a collection", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });

      pm.test("Responds in under 2 seconds", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 1000
