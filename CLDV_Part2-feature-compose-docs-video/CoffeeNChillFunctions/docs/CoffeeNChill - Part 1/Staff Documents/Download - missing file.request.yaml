$kind: http-request
url: "{{baseUrl}}/api/documents/download/nope.pdf"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Says the document was not found", function () {
          pm.expect(pm.response.text()).to.match(/not found/i);
      });
    language: text/javascript
order: 7000
